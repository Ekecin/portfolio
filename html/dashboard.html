<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, sans-serif;
        }
        
        body {
            background: #050505;
            color: white;
            min-height: 100vh;
        }
        
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #00ff88;
            filter: blur(180px);
            opacity: 0.08;
            top: -200px;
            left: -200px;
            border-radius: 50%;
            z-index: -2;
        }
        
        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #6a5cff;
            filter: blur(180px);
            opacity: 0.08;
            bottom: -250px;
            right: -250px;
            border-radius: 50%;
            z-index: -2;
        }
        
        .container {
            width: 95%;
            max-width: 1300px;
            margin: auto;
            padding: 40px 0;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        
        .logo {
            font-size: 30px;
            font-weight: 800;
        }
        
        .logo span {
            color: #00ff88;
        }
        
        .header-right {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }
        
        .add-btn {
            background: #00ff88;
            color: black;
        }
        
        .logout {
            background: #181818;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-3px);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 18px;
        }
        
        .card h3 {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 10px;
        }
        
        .card h1 {
            font-size: 34px;
            color: #00ff88;
        }
        
        .search {
            margin-bottom: 30px;
        }
        
        .search input {
            width: 100%;
            padding: 16px 20px;
            background: #101010;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            outline: none;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }
        
        .search input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }
        
        .table-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: #111;
        }
        
        thead th {
            padding: 18px;
            text-align: left;
            font-size: 15px;
            color: #00ff88;
        }
        
        tbody tr {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s;
        }
        
        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        
        td {
            padding: 18px;
        }
        
        .project-image {
            width: 70px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }
        
        .action {
            display: flex;
            gap: 10px;
        }
        
        .edit {
            background: #0f5132;
            color: white;
        }
        
        .delete {
            background: #7d1b1b;
            color: white;
        }
        
        .action button {
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .modal {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            z-index: 999;
        }
        
        .modal-content {
            width: 500px;
            max-width: 90%;
            background: #111;
            padding: 30px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #bbb;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px;
            background: #181818;
            border: none;
            border-radius: 10px;
            outline: none;
            color: white;
        }
        
        .form-group textarea {
            resize: none;
            height: 100px;
        }
        
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        .cancel {
            background: #444;
            color: white;
        }
        
        .save {
            background: #00ff88;
            color: black;
        }
        
        .modal-buttons button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        
        @media (max-width: 900px) {
            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
            header {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }
            .header-right {
                width: 100%;
            }
            .header-right button {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">EKECIN<span>.</span></div>

            <div class="header-right">
                <button class="btn add-btn" id="openModal">
            <i class="ri-add-line"></i>

            Add Project
          </button>

                <button class="btn logout">Logout</button>
            </div>
        </header>

        <div class="stats">
            <div class="card">
                <h3>Total Projects</h3>

                <h1 id="projectCount">0</h1>
            </div>

            <div class="card">
                <h3>Featured</h3>

                <h1>8</h1>
            </div>

            <div class="card">
                <h3>Technologies</h3>

                <h1>15+</h1>
            </div>
        </div>

        <div class="search">
            <input type="text" id="search" placeholder="Search project..." />
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Image</th>

                        <th>Project</th>

                        <th>Technologies</th>

                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="projectTable">
                    <!-- Projects go here -->
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
<!-- ================= MODALS ================= -->

<div class="modal" id="projectModal">

    <div class="modal-content">

        <h2 id="modalTitle">Add Project</h2>

        <form id="projectForm" enctype="multipart/form-data">

            <input type="hidden" id="projectId">

            <div class="form-group">

                <label>Project Name</label>

                <input type="text" id="title" placeholder="Project Name" required>

            </div>

            <div class="form-group">

                <label>Description</label>

                <textarea id="description" placeholder="Project Description"></textarea>

            </div>

            <div class="form-group">

                <label>Technologies</label>

                <input type="text" id="technology" placeholder="HTML, CSS, Node.js">

            </div>

            <div class="form-group">

                <label>Github Link</label>

                <input type="url" id="github" placeholder="https://github.com/...">

            </div>

            <div class="form-group">

                <label>Live Demo</label>

                <input type="url" id="liveDemo" placeholder="https://">

            </div>

            <div class="form-group">

                <label>Project Image</label>

                <input type="file" id="image" accept="image/*">

            </div>

            <div class="form-group">

                <img id="preview" src="" style="
                        width:100%;
                        max-height:220px;
                        object-fit:cover;
                        border-radius:12px;
                        display:none;
                    ">

            </div>

            <div class="modal-buttons">

                <button type="button" class="cancel" id="closeModal">

                    Cancel

                </button>

                <button type="submit" class="save">

                    Save Project

                </button>

            </div>

        </form>

    </div>

</div>

<!-- DELETE MODAL -->

<div class="modal" id="deleteModal">

    <div class="modal-content">

        <h2>Delete Project</h2>

        <p style="margin:20px 0;color:#aaa;">

            Are you sure you want to delete this project?

        </p>

        <div class="modal-buttons">

            <button class="cancel" id="cancelDelete">

                Cancel

            </button>

            <button class="delete" id="confirmDelete">

                Delete

            </button>

        </div>

    </div>

</div>

</div>

<script>
    const projectTable = document.getElementById("projectTable");
    const projectCount = document.getElementById("projectCount");

    const projectModal = document.getElementById("projectModal");
    const deleteModal = document.getElementById("deleteModal");

    const openModal = document.getElementById("openModal");
    const closeModal = document.getElementById("closeModal");
    const cancelDelete = document.getElementById("cancelDelete");

    const projectForm = document.getElementById("projectForm");

    const preview = document.getElementById("preview");
    const image = document.getElementById("image");

    const modalTitle = document.getElementById("modalTitle");

    const search = document.getElementById("search");

    let projects = [];

    let editingId = null;

    let deletingId = null;


    /* ================================
    OPEN & CLOSE MODALS
    ================================ */

    openModal.onclick = () => {

        modalTitle.innerText = "Add Project";

        editingId = null;

        projectForm.reset();

        preview.style.display = "none";

        projectModal.style.display = "flex";

    }

    closeModal.onclick = () => {

        projectModal.style.display = "none";

    }

    cancelDelete.onclick = () => {

        deleteModal.style.display = "none";

    }

    window.onclick = (e) => {

        if (e.target === projectModal) {

            projectModal.style.display = "none";

        }

        if (e.target === deleteModal) {

            deleteModal.style.display = "none";

        }

    }


    /* ================================
    IMAGE PREVIEW
    ================================ */

    image.onchange = () => {

        const file = image.files[0];

        if (!file) return;

        preview.src = URL.createObjectURL(file);

        preview.style.display = "block";

    }


    /* ================================
    RENDER PROJECTS
    ================================ */

    function renderProjects(data = projects) {

        projectTable.innerHTML = "";

        projectCount.innerText = data.length;

        data.forEach(project => {

            projectTable.innerHTML += `

        <tr>

            <td>

                <img
                src="${project.image}"
                class="project-image">

            </td>

            <td>

                ${project.title}

            </td>

            <td>

                ${project.technology}

            </td>

            <td>

                <div class="action">

                    <button
                    class="edit"
                    onclick="editProject(${project.id})">

                    <i class="ri-edit-line"></i>

                    </button>

                    <button
                    class="delete"
                    onclick="deleteProject(${project.id})">

                    <i class="ri-delete-bin-line"></i>

                    </button>

                </div>

            </td>

        </tr>

        `;

        });

    }


    /* ================================
    SEARCH
    ================================ */

    search.onkeyup = () => {

        const keyword = search.value.toLowerCase();

        const filtered = projects.filter(project => {

            return project.title.toLowerCase().includes(keyword) ||
                project.technology.toLowerCase().includes(keyword);

        });

        renderProjects(filtered);

    }


    /* ================================
    ADD / UPDATE PROJECT
    ================================ */

    projectForm.onsubmit = async(e) => {

        e.preventDefault();

        const formData = new FormData(projectForm);

        if (editingId) {

            /*
                fetch(`/projects/${editingId}`,{

                    method:"PUT",

                    body:formData

                });

            */

        } else {

            /*
                fetch("/projects",{

                    method:"POST",

                    body:formData

                });

            */

        }

        projectModal.style.display = "none";

    }


    /* ================================
    EDIT PROJECT
    ================================ */

    function editProject(id) {

        const project = projects.find(item => item.id === id);

        if (!project) return;

        editingId = id;

        modalTitle.innerText = "Edit Project";

        document.getElementById("title").value = project.title;

        document.getElementById("description").value = project.description;

        document.getElementById("technology").value = project.technology;

        document.getElementById("github").value = project.github;

        document.getElementById("liveDemo").value = project.liveDemo;

        preview.src = project.image;

        preview.style.display = "block";

        projectModal.style.display = "flex";

    }


    /* ================================
    DELETE
    ================================ */

    function deleteProject(id) {

        deletingId = id;

        deleteModal.style.display = "flex";

    }

    document.getElementById("confirmDelete").onclick = async() => {

        /*
            await fetch(`/projects/${deletingId}`,{

                method:"DELETE"

            });
        */

        deleteModal.style.display = "none";

    }


    /* ================================
    LOAD PROJECTS
    ================================ */

    async function loadProjects() {

        /*
            const response = await fetch("/projects");

            projects = await response.json();
        */

        // Dummy Data

        projects = [

            {

                id: 1,

                image: "https://placehold.co/100x70",

                title: "Portfolio",

                description: "Personal Portfolio",

                technology: "HTML, CSS, JS",

                github: "#",

                liveDemo: "#"

            },

            {

                id: 2,

                image: "https://placehold.co/100x70",

                title: "AI Chatbot",

                description: "ChatGPT",

                technology: "Node.js, Express",

                github: "#",

                liveDemo: "#"

            }

        ];

        renderProjects();

    }

    loadProjects();
</script>

</body>

</html>
